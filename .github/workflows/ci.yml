name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server-tests:
    name: Server tests (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  client-tests:
    name: Extension logic tests (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pure-logic suites for the extension (readiness math, SM-2 clamping,
      # weak-topic ranking, sync mapping, store tombstones/regression,
      # share/team link formatting and parsing).
      - run: node tests/client-logic.test.mjs
      - run: node tests/sync-map.test.mjs
      - run: node tests/store.test.mjs
      - run: node tests/share-link.test.mjs
      - run: node tests/teams-ui.test.mjs
      - run: node tests/ui-static.test.mjs
      - run: node tests/billing.test.mjs
      # Syntax-check every extension source file.
      - run: |
          fail=0
          for f in $(find src -name '*.js'); do
            node --check "$f" || fail=1
          done
          exit $fail
      # Guard against encoding corruption (a raw NUL byte once made
      # quizlet-import.js unloadable by tooling).
      - name: No control bytes in sources
        run: |
          if grep -rP '[\x00-\x08\x0b\x0c\x0e-\x1f]' src --include='*.js' --include='*.html' --include='*.css'; then
            echo "::error::Raw control bytes found in source files"; exit 1
          fi

  build-server:
    name: Server typecheck + boot smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # Boot the server against a local file DB and hit the health endpoint —
      # catches runtime breakage (bad imports, env handling) before deploy.
      - name: Boot smoke test
        run: |
          npx tsx src/index.ts &
          for i in $(seq 1 20); do
            curl -sf http://localhost:8787/healthz && exit 0
            sleep 1
          done
          echo "server did not become healthy" && exit 1
