name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server-tests:
    name: Server tests (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  client-tests:
    name: Extension logic tests (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Every pure-logic suite for the extension — discovered, not listed.
      # A hand-maintained list silently dropped six suites (coding, srs,
      # quiz-lengths, google-signin, last-answer, messaging): they existed and
      # passed locally while CI never ran them. Globbing makes a new suite
      # covered the moment it is added.
      - name: Extension logic suites
        run: |
          shopt -s nullglob
          found=0
          fail=0
          for f in tests/*.test.mjs; do
            found=$((found + 1))
            echo "::group::$f"
            node "$f" || fail=1
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No test suites matched tests/*.test.mjs"; exit 1
          fi
          echo "ran $found suite(s)"
          exit $fail
      # Syntax-check every extension source file.
      - run: |
          fail=0
          for f in $(find src -name '*.js'); do
            node --check "$f" || fail=1
          done
          exit $fail
      # Guard against encoding corruption (a raw NUL byte once made
      # quizlet-import.js unloadable by tooling).
      - name: No control bytes in sources
        run: |
          if grep -rP '[\x00-\x08\x0b\x0c\x0e-\x1f]' src --include='*.js' --include='*.html' --include='*.css'; then
            echo "::error::Raw control bytes found in source files"; exit 1
          fi

  build-server:
    name: Server typecheck + boot smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # Boot the server against a local file DB and hit the health endpoint —
      # catches runtime breakage (bad imports, env handling) before deploy.
      - name: Boot smoke test
        run: |
          npx tsx src/index.ts &
          for i in $(seq 1 20); do
            curl -sf http://localhost:8787/healthz && exit 0
            sleep 1
          done
          echo "server did not become healthy" && exit 1
