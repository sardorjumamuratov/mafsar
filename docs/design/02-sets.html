<helmet>

<div data-screen-label="02 Sets" style="display:flex;flex-direction:column;gap:12px;width:390px">

      <div style="position:relative;width:390px;height:884px;border-radius:24px;overflow:hidden;background:#0e1513;color:#e7eeec;box-shadow:0 20px 50px rgba(10,20,18,.25);display:flex;flex-direction:column">

              <sc-if value="{{ filterActive3 }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:4px;background:#34bcad;box-shadow:0 0 0 2px #141d1b"></span></sc-if>

        <div style="height:64px;flex-shrink:0;background:#0b1110;display:grid;grid-template-columns:repeat(5,1fr);align-items:center">

          <div style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#5fd3c5;font-size:11px;font-weight:600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>Sets</div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#8b9a96;font-size:11px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg>Discover</div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#8b9a96;font-size:11px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20v-8M12 20V5M19 20v-5"></path></svg>Stats</div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#8b9a96;font-size:11px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 20.5c.8-4 4-6 8-6s7.2 2 8 6"></path></svg>You</div>

        <sc-if value="{{ filterOpen3 }}" hint-placeholder-val="{{ false }}">
          <div onClick="{{ closeFilter3 }}" style="position:absolute;inset:0;z-index:2;background:rgba(0,0,0,.6);display:flex;align-items:flex-end">

                    <span style="width:18px;display:flex"><sc-if value="{{ o.sel }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5fd3c5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if></span>

              </div>
              <div style="display:flex;flex-direction:column;gap:4px">
                <div style="font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#9aa9a4;padding:0 6px 4px">Sort by</div>
                <sc-for list="{{ sortOpts3 }}" as="o" hint-placeholder-count="4">
                  <button onClick="{{ o.select }}" style="display:flex;align-items:center;gap:12px;height:48px;padding:0 12px;border-radius:12px;border:1px solid {{ o.border }};background:{{ o.bg }};color:#e7eeec;text-align:left;cursor:pointer">
