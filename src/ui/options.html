<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mafsar — Settings</title>
    <style>
      :root {
        color-scheme: light dark;
        --accent: #0b6e77;
      }
      body {
        font: 14px/1.5 system-ui, -apple-system, sans-serif;
        max-width: 560px;
        margin: 40px auto;
        padding: 0 20px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      p.sub {
        margin: 0 0 24px;
        opacity: 0.7;
      }
      label {
        display: block;
        font-weight: 600;
        margin: 18px 0 6px;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 6px;
      }
      input[type="time"] {
        padding: 9px 11px;
        font: inherit;
        border: 1px solid rgba(128, 128, 128, 0.4);
        border-radius: 8px;
        background: transparent;
        color: inherit;
      }
      button {
        padding: 9px 18px;
        font: 600 14px inherit;
        color: #fff;
        background: var(--accent);
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      button:hover {
        background: #085a62;
      }
      #status {
        font-size: 13px;
        opacity: 0.85;
      }
      .note {
        margin-top: 26px;
        padding: 11px 13px;
        font-size: 12.5px;
        line-height: 1.5;
        background: rgba(128, 128, 128, 0.1);
        border-radius: 8px;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <h1>Mafsar settings</h1>
    <p class="sub">Turn your AI chat learning sessions into flashcards & quizzes.</p>

    <label for="reminders">Daily study reminder</label>
    <div class="row">
      <input id="reminders" type="checkbox" />
      <span>Remind me at</span>
      <input id="remindTime" type="time" />
      <span style="opacity: 0.7">if cards are due</span>
    </div>

    <div class="row" style="margin-top: 24px">
      <button id="save">Save</button>
      <span id="status"></span>
    </div>

    <div class="note">
      Generation and grading run on the Mafsar cloud with your account — no API key needed.
      Your account and sync settings live in the extension panel under <b>You</b>.
    </div>

    <script type="module" src="options.js"></script>
  </body>
</html>
