<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Mafsar</title>
    <link rel="stylesheet" href="../vendor/flatpickr.css" />
    <link rel="stylesheet" href="panel.css" />
    <script src="../vendor/flatpickr.js"></script>
  </head>
  <body>
    <!-- View container — every screen is rendered here by panel.js -->
    <main id="app"></main>

    <!-- Persistent bottom navigation (hidden in focus modes) -->
    <nav id="bottomNav">
      <button data-nav="home" class="on" title="Home">
        <svg class="ic" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7" /><path d="M6 10v9h12v-9" /></svg>
        Home
      </button>
      <button data-nav="sets" title="Sets">
        <svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
        Sets
      </button>
      <button data-nav="review" class="center" title="Review due">
        <span class="cbtn"><svg class="ic" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg></span>
      </button>
      <button data-nav="teams" title="Teams">
        <svg class="ic" viewBox="0 0 24 24">
          <circle cx="9" cy="8" r="3" /><path d="M3 20a6 6 0 0 1 12 0" />
          <path d="M16 6a3 3 0 0 1 0 6" /><path d="M18 20a6 6 0 0 0-3-5" />
        </svg>
        Teams
      </button>
      <button data-nav="you" title="You">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" /><path d="M4 21a8 8 0 0 1 16 0" /></svg>
        You
      </button>
    </nav>

    <div id="toast" class="toast hidden"></div>

    <script type="module" src="panel.js"></script>
  </body>
</html>
