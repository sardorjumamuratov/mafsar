<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Mafsar</title>
    <link rel="stylesheet" href="../vendor/flatpickr.css" />
    <link rel="stylesheet" href="panel.css" />
    <script src="../vendor/flatpickr.js"></script>
  </head>
  <body>
    <!-- View container — every screen is rendered here by panel.js -->
    <main id="app"></main>

    <!-- Persistent bottom navigation (hidden in focus modes) -->
    <div id="captureDock" class="capture-dock hidden">
      <button id="captureAnswerBtn" class="btn btn-primary hidden" data-action="capture-last-answer">Capture answer</button>
      <button id="captureCurrentBtn" class="btn btn-primary" data-action="capture-current">Capture page</button>
    </div>
    
    <nav id="bottomNav">
      <button data-nav="home" class="on" title="Home">
        <svg class="ic" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7" /><path d="M6 10v9h12v-9" /></svg>
        Home
      </button>
      <button data-nav="sets" title="Sets">
        <svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
        Sets
      </button>
      <button data-nav="discover" title="Discover">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M3.6 9h16.8M3.6 15h16.8M12 3c-2.4 2.8-4 5.8-4 9s1.6 6.2 4 9c2.4-2.8 4-5.8 4-9s-1.6-6.2-4-9z" /></svg>
        Discover
      </button>
      <button data-nav="stats" title="Stats">
        <svg class="ic" viewBox="0 0 24 24"><path d="M4 20h16M4 16h4M10 12h4M16 8h4" /></svg>
        Stats
      </button>
      <button data-nav="you" title="You">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" /><path d="M4 21a8 8 0 0 1 16 0" /></svg>
        You
      </button>
    </nav>


    <div id="sheet" class="sheet hidden"></div>
    <div id="toast" class="toast hidden"></div>

    <script type="module" src="panel.js"></script>
  </body>
</html>
