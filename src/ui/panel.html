<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Mafsar</title>
    <link rel="stylesheet" href="../vendor/flatpickr.css" />
    <link rel="preload" as="font" type="font/woff2" href="../vendor/geist/Geist[wght].woff2" crossorigin>
  <link rel="stylesheet" href="panel.css" />
    <script src="../vendor/flatpickr.js"></script>
  </head>
  <body>
    <!-- View container — every screen is rendered here by panel.js -->
    <main id="app"></main>

    <!-- Persistent bottom navigation (hidden in focus modes) -->
    <div id="captureDock" class="capture-dock hidden">
      <button id="captureAnswerBtn" class="btn btn-primary hidden" data-action="capture-last-answer">Capture answer</button>
      <button id="captureCurrentBtn" class="btn btn-primary" data-action="capture-current">Capture page</button>
    </div>
    <nav id="bottomNav" class="bottom-nav">
      <button data-nav="home" class="nav-item active" aria-current="page">
        <span class="nav-icon"><svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></span>
        <span class="nav-label">Home</span>
      </button>
      <button data-nav="sets" class="nav-item">
        <span class="nav-icon"><svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></span>
        <span class="nav-label">Sets</span>
      </button>
      <button data-nav="discover" class="nav-item">
        <span class="nav-icon"><svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg></span>
        <span class="nav-label">Discover</span>
      </button>
      <button data-nav="stats" class="nav-item">
        <span class="nav-icon"><svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg></span>
        <span class="nav-label">Stats</span>
      </button>
      <button data-nav="you" class="nav-item">
        <span class="nav-icon"><svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span>
        <span class="nav-label">You</span>
      </button>
    </nav>

    <div id="sheet" class="sheet hidden"></div>
    <div id="toast" class="toast hidden"></div>

    <script type="module" src="panel.js"></script>
  </body>
</html>
