<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Mafsar</title>
    <link rel="stylesheet" href="../vendor/flatpickr.css" />
    <link rel="preload" as="font" type="font/woff2" href="../vendor/geist/Geist[wght].woff2" crossorigin>
  <link rel="stylesheet" href="panel.css" />
    <script src="../vendor/flatpickr.js"></script>
  </head>
  <body>
    <!-- View container — every screen is rendered here by panel.js -->
    <main id="app"></main>

    <!-- Persistent bottom navigation (hidden in focus modes) -->
    <!-- Capture dock and bottom nav: docs/design/0N-*.html, the two bars under every screen. -->
    <div id="captureDock" class="capture-dock hidden">
        <button id="captureCurrentBtn" class="dock-btn" data-action="capture-current">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent-text)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9V5a1 1 0 011-1h4M15 4h4a1 1 0 011 1v4M20 15v4a1 1 0 01-1 1h-4M9 20H5a1 1 0 01-1-1v-4"/></svg>
          <span class="dock-lbl">Capture page</span>
        </button>
        <button id="captureAnswerBtn" class="dock-btn" data-action="capture-last-answer" aria-label="Capture last answer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent-text)" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14a1 1 0 011 1v9a1 1 0 01-1 1H10l-4 3.5V16H5a1 1 0 01-1-1V6a1 1 0 011-1z"/></svg>
          <span class="dock-lbl">Capture answer</span>
        </button>
        <button id="dockAddBtn" class="dock-btn add-btn" data-action="dock-add" aria-label="Import or create">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    <nav id="bottomNav" class="bottom-nav">
      <button data-nav="home" class="nav-item active" aria-current="page">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20h-5v-6H9v6H4z"/></svg></span>
        <span class="nav-label">Home</span>
      </button>
      <button data-nav="sets" class="nav-item">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></span>
        <span class="nav-label">Sets</span>
      </button>
      <button data-nav="discover" class="nav-item">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></span>
        <span class="nav-label">Discover</span>
      </button>
      <button data-nav="stats" class="nav-item">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M5 20v-8M12 20V5M19 20v-5"/></svg></span>
        <span class="nav-label">Stats</span>
      </button>
      <button data-nav="you" class="nav-item">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20.5c.8-4 4-6 8-6s7.2 2 8 6"/></svg></span>
        <span class="nav-label">You</span>
      </button>
    </nav>

    <div id="sheet" class="sheet hidden"></div>
    <div id="toast" class="toast hidden"></div>

    <script type="module" src="panel.js"></script>
  </body>
</html>
