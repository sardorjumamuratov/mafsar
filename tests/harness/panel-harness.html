<!doctype html>
<!-- Dev-only harness: loads the real panel with a stubbed chrome.* API so the
     UI can be exercised in a plain browser tab. Not shipped. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mafsar panel harness</title>
    <link rel="stylesheet" href="../../src/ui/panel.css" />
    <style>
      /* The references' viewport (docs/design/0N-*.html): 390 × 884. */
      html, body { height: 884px; }
      body { width: 390px; max-width: 390px; margin: 0 auto; position: relative; overflow: hidden; }
    </style>
    <script>
      // ---- console/error capture for the test driver ----
      window.__errors = [];
      window.addEventListener("error", (e) => window.__errors.push(String(e.message) + "\n" + (e.error?.stack || "")));
      window.addEventListener("unhandledrejection", (e) =>
        window.__errors.push("rejection: " + String(e.reason) + "\n" + (e.reason?.stack || "")));

      // ---- chrome.* stub with realistic sample data ----
      const NOW = Date.now();
      const DATA = {
        settings: { provider: "gemini", apiKey: "k", model: "", reminders: false, remindTime: "19:00" },
        sessions: [
          { id: "sess1", source: "chatgpt", sourceLabel: "ChatGPT", title: "Torts", url: "", capturedAt: NOW - 86400000, messages: [{ role: "user", text: "negligence?" }] },
          { id: "sess2", source: "quizlet", sourceLabel: "Imported", title: "Bio ch3", url: "", capturedAt: NOW - 172800000, messages: [], importedCount: 2 },
          { id: "sess3", source: "claude", sourceLabel: "Claude", title: "Pharmacology (big set)", url: "", capturedAt: NOW - 259200000, messages: [{ role: "user", text: "beta blockers?" }] },
          { id: "sess4", source: "chatgpt", sourceLabel: "ChatGPT", title: "Java OOP", url: "", capturedAt: NOW - 3600000, messages: [{ role: "user", text: "encapsulation?" }] },
          { id: "sess5", source: "chatgpt", sourceLabel: "ChatGPT", title: "Obstructive airway disease", url: "", capturedAt: NOW - 7200000, messages: [{ role: "user", text: "asthma vs copd?" }] },
        ],
        studySets: [
          {
            id: "set1", sessionId: "sess1", title: "Torts", mode: "law",
            examDate: NOW + 5 * 86400000, createdAt: NOW - 86400000, updatedAt: "2026-08-14T10:00:00.000Z", deleted: false,
            flashcards: [
              { id: "c1", front: "Elements of negligence", back: "Duty, breach, causation, damages", easiness: 2.2, interval: 2, repetitions: 1, dueDate: NOW - 3600000, updatedAt: "2026-08-14T10:00:00.000Z", deleted: false },
              { id: "c2", front: "Res ipsa loquitur", back: "The thing speaks for itself", easiness: 2.5, interval: 0, repetitions: 0, dueDate: NOW, updatedAt: "2026-08-14T10:00:00.000Z", deleted: false },
            ],
            quiz: [{ id: "q1", q: "2+2?", options: ["3", "4", "5", "6"], answer: 1, explain: "math", updatedAt: "2026-08-14T10:00:00.000Z", deleted: false }],
          },
          {
            id: "set2", sessionId: "sess2", title: "Bio ch3", createdAt: NOW - 172800000, updatedAt: "2026-08-13T09:00:00.000Z", deleted: false,
            flashcards: [
              { id: "c3", front: "Mitochondria", back: "Powerhouse of the cell", easiness: 2.5, interval: 0, repetitions: 0, dueDate: NOW, updatedAt: "2026-08-13T09:00:00.000Z", deleted: false },
            ],
            quiz: [],
          },
          // 30 cards + 30 questions: exercises the quiz-length picker, which only
          // appears at 20+ cards.
          {
            id: "set3", sessionId: "sess3", title: "Pharmacology (big set)", createdAt: NOW - 259200000, updatedAt: "2026-08-12T09:00:00.000Z", deleted: false,
            flashcards: Array.from({ length: 30 }, (_, i) => ({
              id: "bc" + i, front: "Big card " + (i + 1), back: "Answer " + (i + 1),
              easiness: 2.5, interval: 0, repetitions: i < 6 ? 3 : 0, dueDate: NOW,
              updatedAt: "2026-08-12T09:00:00.000Z", deleted: false,
            })),
            quiz: Array.from({ length: 30 }, (_, i) => ({
              id: "bq" + i, q: "Big question " + (i + 1),
              options: ["Right " + (i + 1), "Wrong A", "Wrong B", "Wrong C"], answer: 0,
              explain: "Because " + (i + 1), updatedAt: "2026-08-12T09:00:00.000Z", deleted: false,
            })),
          },
          // mode:"coding" — review swaps the Apply button for Solve in code.
          {
            id: "set4", sessionId: "sess4", title: "Java OOP", mode: "coding",
            createdAt: NOW - 3600000, updatedAt: "2026-08-19T09:00:00.000Z", deleted: false,
            flashcards: [
              { id: "jc1", front: "Encapsulation", back: "Hide state behind private fields; expose controlled access via methods.", easiness: 2.5, interval: 0, repetitions: 0, dueDate: NOW, updatedAt: "2026-08-19T09:00:00.000Z", deleted: false },
              { id: "jc2", front: "Polymorphism", back: "Treat different subclasses uniformly through a shared supertype.", easiness: 2.5, interval: 0, repetitions: 0, dueDate: NOW, updatedAt: "2026-08-19T09:00:00.000Z", deleted: false },
            ],
            quiz: [],
          },
          {
            id: "set5", sessionId: "sess5", title: "Obstructive airway disease", mode: "medicine",
            createdAt: NOW - 7200000, updatedAt: "2026-09-01T09:00:00.000Z", deleted: false,
            chains: [
            {
              id: "ch-asthma", template: "medicine-condition", title: "Asthma",
              updatedAt: "2026-09-01T09:00:00.000Z",
              steps: [
              { id: "st-ch-asthma-cause", key: "cause", statement: "An allergen or cold air triggers a sensitised airway.", why: "The airway is already primed by type 2 inflammation.", updatedAt: "2026-09-01T09:00:00.000Z" },
              { id: "st-ch-asthma-mechanism", key: "mechanism", statement: "Mast cells degranulate and smooth muscle constricts.", why: "Histamine and leukotrienes act within minutes.", updatedAt: "2026-09-01T09:00:00.000Z" },
              { id: "st-ch-asthma-physiological", key: "physiological", statement: "Airflow limitation that reverses with a bronchodilator.", why: "The obstruction is muscular, so relaxing it opens the airway.", updatedAt: "2026-09-01T09:00:00.000Z" },
              { id: "st-ch-asthma-symptoms", key: "symptoms", statement: "Episodic wheeze, cough and chest tightness, worse at night.", why: "", updatedAt: "2026-09-01T09:00:00.000Z" },
              { id: "st-ch-asthma-signs", key: "signs", statement: "Expiratory wheeze; prolonged expiratory phase.", why: "", updatedAt: "2026-09-01T09:00:00.000Z" },
              { id: "st-ch-asthma-tests", key: "tests", statement: "Spirometry shows obstruction that reverses after salbutamol.", why: "Reversibility is the fork away from COPD.", updatedAt: "2026-09-01T09:00:00.000Z" },
              { id: "st-ch-asthma-diagnosis", key: "diagnosis", statement: "Asthma.", why: "", updatedAt: "2026-09-01T09:00:00.000Z" },
              { id: "st-ch-asthma-treatment", key: "treatment", statement: "Inhaled corticosteroid, with a reliever as needed.", why: "", updatedAt: "2026-09-01T09:00:00.000Z" },
              ],
            },
            {
              id: "ch-copd", template: "medicine-condition", title: "COPD",
              updatedAt: "2026-09-01T09:00:00.000Z",
              steps: [
              { id: "st-ch-copd-cause", key: "cause", statement: "Years of smoke exposure damage the airway and alveoli.", why: "The insult is cumulative, not episodic.", updatedAt: "2026-09-01T09:00:00.000Z" },
              { id: "st-ch-copd-mechanism", key: "mechanism", statement: "Neutrophilic inflammation with loss of elastic recoil.", why: "Destroyed tissue does not spring back.", updatedAt: "2026-09-01T09:00:00.000Z" },
              { id: "st-ch-copd-physiological", key: "physiological", statement: "Airflow limitation that is largely fixed.", why: "The obstruction is structural, so a bronchodilator barely moves it.", updatedAt: "2026-09-01T09:00:00.000Z" },
              { id: "st-ch-copd-symptoms", key: "symptoms", statement: "Daily productive cough and progressive breathlessness.", why: "", updatedAt: "2026-09-01T09:00:00.000Z" },
              { id: "st-ch-copd-signs", key: "signs", statement: "Barrel chest; quiet breath sounds.", why: "", updatedAt: "2026-09-01T09:00:00.000Z" },
              { id: "st-ch-copd-tests", key: "tests", statement: "Post-bronchodilator FEV1/FVC stays below 0.7.", why: "No meaningful reversibility.", updatedAt: "2026-09-01T09:00:00.000Z" },
              { id: "st-ch-copd-diagnosis", key: "diagnosis", statement: "COPD.", why: "", updatedAt: "2026-09-01T09:00:00.000Z" },
              { id: "st-ch-copd-treatment", key: "treatment", statement: "Long-acting bronchodilator; stop smoking.", why: "", updatedAt: "2026-09-01T09:00:00.000Z" },
              ],
            },
            ],
            flashcards: [
              { id: "mc1", front: "What reverses in asthma but not COPD?", back: "Airflow obstruction, after a bronchodilator.", easiness: 2.5, interval: 0, repetitions: 0, dueDate: NOW, updatedAt: "2026-09-01T09:00:00.000Z", deleted: false },
            ],
            quiz: [],
          },
        ],
        activity: {},
        // ?noStats keeps the log short, for the Stats empty state.
        reviewLog: new URLSearchParams(location.search).has("noStats")
          ? [{ id: "r1", cardId: "c1", sessionId: "sess1", grade: 4, prevInterval: 1, newInterval: 1, reviewedAt: new Date(NOW - 3600000).toISOString() }]
          : Array.from({ length: 300 }, (_, i) => ({
              id: "r" + i, cardId: "bc" + (i % 30), sessionId: i % 3 ? "sess3" : "sess1",
              grade: i % 7 === 0 ? 0 : i % 5 === 0 ? 3 : 4, prevInterval: 1, newInterval: 2,
              reviewedAt: new Date(NOW - (i % 9) * 86400000 - (i % 11) * 3600000).toISOString(),
              ...(i % 2 ? { durationMs: 25000 } : {}),
            })),
        // Load with ?signedIn to skip the first-launch auth gate and land on Home.
        auth: new URLSearchParams(location.search).has("signedIn")
          ? { accessToken: "harness", refreshToken: "harness", user: { email: "harness@example.com" }, lastSync: null }
          : null,
      };
      // ?theme=dark flips the panel's [data-theme="dark"] token override.
      if (new URLSearchParams(location.search).get("theme") === "dark") {
        document.documentElement.dataset.theme = "dark";
      }
      DATA.activity[new Date(NOW - 86400000).toISOString().slice(0, 10)] = 3;

      function clone(v) { return v === undefined ? undefined : JSON.parse(JSON.stringify(v)); }

      window.chrome = {
        storage: {
          onChanged: { addListener() {} },
          local: {
            get(arg, cb) {
              if (arg === null || arg === undefined) {
                setTimeout(() => cb(clone(DATA)), 0);
                return;
              }
              const keys = Array.isArray(arg) ? arg : typeof arg === "object" ? Object.keys(arg) : [arg];
              const out = {};
              for (const k of keys) if (DATA[k] !== undefined) out[k] = clone(DATA[k]);
              setTimeout(() => cb(out), 0);
            },
            getBytesInUse(_keys, cb) {
              setTimeout(() => cb(JSON.stringify(DATA).length), 0);
            },
            set(obj, cb) {
              for (const [k, v] of Object.entries(obj)) DATA[k] = clone(v);
              setTimeout(() => cb && cb(), 0);
            },
            remove(key, cb) {
              for (const k of Array.isArray(key) ? key : [key]) delete DATA[k];
              setTimeout(() => cb && cb(), 0);
            },
          },
        },
        runtime: {
          lastError: null,
          sendMessage(msg, cb) {
            const fake = {
              GENERATE_CODING_TASK: () => ({ ok: true, task: {
                scenario: "Implement a BankAccount that never allows a negative balance.",
                language: "java",
                starter: "public class BankAccount {\n    private double balance;\n\n    public void deposit(double amount) {\n        // TODO\n    }\n}",
                expectedLines: 12,
                rubric: ["balance is private", "deposit rejects negative amounts"],
              } }),
              // Study modes. Shapes follow server/src/llm.ts, so the screens see what the real backend sends.
              GRADE_ANSWER: () => ({ ok: true, grading: { score: 55, correct: false, feedback: "You named duty and breach but left out causation and damages, so the claim isn't complete." } }),
              GENERATE_HYPOTHETICAL: () => ({ ok: true, hypothetical: { scenario: "A cyclist is hit by a van whose driver was texting. Which elements of negligence can the cyclist show?", rubric: "Duty, breach, causation, damages." } }),
              TEACH_TURN: (m) => ({ ok: true, turn: { reply: m.wantHint ? "Think about what the person owes everyone else on the road." : "Okay, but why does that matter? What happens if someone ignores it?", kind: "question", focusCardId: "c1", coverage: { c1: "covered" }, done: false } }),
              TEACH_EVALUATE: () => ({ ok: true, evaluation: { scores: { understanding: 78, accuracy: 82, completeness: 64, simplicity: 90 }, strengths: "You kept it concrete and used one clear example.", ideas: [{ cardId: "c1", front: "Elements of negligence", status: "taught", note: "All four elements, in order." }, { cardId: "c2", front: "Res ipsa loquitur", status: "not_covered", note: "" }], jargon: ["causation"], improve: "Say what each element means in one plain sentence.", modelExplanation: "Negligence is carelessness that hurts someone, and four things must be shown." } }),
              DESIGN_TASK: (m) => m.mode === "clinical"
                ? ({ ok: true, brief: "A 24-year-old woman presents with three weeks of episodic wheeze and a dry cough, worse at night and after exercise. She has eczema and her father has hay fever. Examination shows a prolonged expiratory phase with scattered expiratory wheeze; oxygen saturation is 97% on air.", rubric: ["Peak expiratory flow", "Spirometry with bronchodilator reversibility", "Chest X-ray", "Full blood count"], state: "harness-state" })
                : ({ ok: true, brief: "Design a URL shortener. It takes 5k writes a second, reads are 100 times writes, and links never expire. Redirects must stay under 50 ms at the 99th percentile, and the service has to survive the loss of a single data centre without losing any link that was already created. Keep the design to what you could explain in fifteen minutes.", rubric: ["States the read/write ratio", "Chooses a code generation scheme", "Caches hot links", "Names the single-primary bottleneck"] }),
              DESIGN_GRADE: (m) => m.mode === "clinical"
                ? ({ ok: true, rubric_evaluation: [], sections: [{ section: "Diagnosis", verdict: "strong", note: "Asthma fits the atopy, nocturnal symptoms and reversible wheeze." }, { section: "Tests requested", verdict: "weak", note: "Spirometry is right, but a chest X-ray isn't indicated here." }], next_time: "Ask what the test result would change.", results: [{ name: "Peak expiratory flow", result: "Variable, 20% below predicted in the morning." }, { name: "Spirometry with bronchodilator reversibility", result: "FEV1/FVC 0.64, rising to 0.78 after salbutamol." }, { name: "Chest X-ray", result: "Normal." }, { name: "Full blood count", result: "Eosinophils mildly raised." }], diagnosis: "Asthma", management: "Inhaled corticosteroid with a reliever." })
                : ({ ok: true, rubric_evaluation: [{ point: "States the read/write ratio", status: "covered", note: "Said 100:1." }, { point: "Chooses a code generation scheme", status: "partial", note: "Counter, but no collision story." }, { point: "Caches hot links", status: "missed", note: "" }, { point: "Names the single-primary bottleneck", status: "missed", note: "" }], sections: [{ section: "Requirements", verdict: "strong", note: "Clear numbers and a latency target." }, { section: "Estimates", verdict: "ok", note: "Storage is right; bandwidth is missing." }, { section: "API", verdict: "weak", note: "Only one endpoint named." }], next_time: "Say what you would cache and why." }),
              ESTIMATION_TASK: () => ({ ok: true, questions: [
                { question: "A service gets 50M daily users making 20 requests each. What is the average QPS?", reference_value: 11574, reference_unit: "QPS", worked_solution: "50M x 20 = 1B requests a day\n1B / 86,400 s is about 11,574\nSo roughly 12k QPS on average." },
                { question: "Storing 1 KB for each of 500M links, how much storage is that?", reference_value: 500, reference_unit: "GB", worked_solution: "500M x 1 KB = 500 GB\nBefore replication." },
                { question: "A 2 MB image served 1,000 times a second needs how much bandwidth?", reference_value: 2, reference_unit: "GB/s", worked_solution: "2 MB x 1,000 = 2,000 MB/s\nThat is 2 GB/s." },
              ] }),
              ESTIMATION_SUMMARY: () => ({ ok: true, habit_to_fix: "Convert per-day numbers to per-second before sizing anything." }),
              BOTTLENECK_TASK: () => ({ ok: true, narrative: "A photo app sends every upload through three API servers to one PostgreSQL primary. Traffic is 8k uploads a second at peak, across four regions, and each upload writes a metadata row and updates the owner's counters.", architecture: ["CDN", "Load balancer", "API servers (3x)", "Cache: Redis", "PostgreSQL primary", "Object storage"], state: "harness-state" }),
              BOTTLENECK_HINT: () => ({ ok: true, hint: "Follow one write all the way to disk, and count how many places it can happen." }),
              BOTTLENECK_GRADE: () => ({ ok: true, found_flaw: true, explanation_correct: true, fix_works: false, other_valid_issue: "", feedback: "You found the single write primary and explained the load, but sharding alone doesn't fix cross-region latency.", score: 2, usedHint: false, planted_flaw: "All writes from four regions go to one PostgreSQL primary.", why_it_fails: "At 8k writes a second the primary saturates and cross-region round trips dominate latency.", model_solution: "Shard by user id and keep a regional primary per shard; accept eventual consistency for counters." }),
              SHARE_CREATE: () => ({ ok: true, code: '7KX2M9QRTA' }),
              SHARE_FETCH: () => ({ ok: true, title: 'Torts basics (shared)', cards: [
                { front: 'Duty of care', back: 'Obligation to avoid foreseeable harm' },
                { front: 'Res ipsa loquitur', back: 'The thing speaks for itself' },
              ], quiz: [{ q: 'Element linking breach to harm?', options: ['Causation','Duty','Damages','Defence'], answer: 0, explain: 'but-for test' }] }),
              SHARE_REVOKE: () => ({ ok: true }),
              GLOBAL_LIST: () => ({ ok: true, nextCursor: null, sets: [
                { id: "g1", title: "OSI model, layer by layer", source: "aistudio", sourceLabel: "AI Studio", authorName: "Daniyar S.", cardCount: 32, ratingAvg: 4.9, ratingCount: 1204, published_at: new Date(NOW - 40 * 86400000).toISOString(), added: false, reasonSetTitle: "Torts" },
                { id: "g2", title: "Subnetting in 20 cards", source: "chatgpt", sourceLabel: "ChatGPT", authorName: "Lena W.", cardCount: 20, ratingAvg: 4.8, ratingCount: 864, published_at: new Date(NOW - 12 * 86400000).toISOString(), added: true },
                { id: "g3", title: "TCP vs UDP", source: "youtube", sourceLabel: "YouTube", authorName: "Aigerim T.", cardCount: 14, ratingAvg: 4.7, ratingCount: 402, published_at: new Date(NOW - 2 * 86400000).toISOString(), added: false },
                { id: "g4", title: "OCJP 17: tricky questions", source: "quizlet", sourceLabel: "Quizlet", authorName: "Timur A.", cardCount: 45, ratingAvg: 4.4, ratingCount: 96, published_at: new Date(NOW - 86400000).toISOString(), added: false },
              ] }),
              GLOBAL_FETCH: () => ({ ok: true, cards: [
                { front: "What does the transport layer guarantee?" }, { front: "Which layer do routers operate on?" }, { front: "What is encapsulation?" },
              ] }),
              GRADE_CODING: () => ({ ok: true, grading: {
                correct: true, score: 92,
                meets: [
                  { requirement: "balance is private", met: true, note: 'Declared as "private double balance".' },
                  { requirement: "deposit rejects negative amounts", met: false, note: "No guard on the amount." },
                ],
                conciseness: { expected: 12, actual: 30, note: "Longer than the task needed." },
                feedback: "Field encapsulation is right; add a guard in deposit.",
              } }),
            }[msg && msg.type];
            setTimeout(() => cb && cb(fake ? fake(msg) : { ok: false, error: "harness: no service worker" }), 0);
          },
          openOptionsPage() {},
          getURL: (p) => p,
          getManifest: () => ({ version: "0.0.0-harness" }),
          onMessage: { addListener() {} },
        },
        tabs: {
          // The sign-in screen listens for the Google tab being closed.
          onRemoved: { addListener() {}, removeListener() {} },
          create(_o, cb) { setTimeout(() => cb && cb({ id: 1 }), 0); },
          remove() { return Promise.resolve(); },
          query(_q, cb) { setTimeout(() => cb && cb([]), 0); },
          sendMessage(_id, _msg, cb) { setTimeout(() => cb && cb(null), 0); },
        },
      };
      window.__data = DATA;
    </script>
  </head>
  <body>
    <!-- Mirrors src/ui/panel.html's body. -->
    <main id="app"></main>
    <div id="captureDock" class="capture-dock hidden">
      <button id="captureCurrentBtn" class="dock-btn" data-action="capture-current">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent-text)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9V5a1 1 0 011-1h4M15 4h4a1 1 0 011 1v4M20 15v4a1 1 0 01-1 1h-4M9 20H5a1 1 0 01-1-1v-4"/></svg>
        <span class="dock-lbl">Capture page</span>
      </button>
      <button id="captureAnswerBtn" class="dock-btn" data-action="capture-last-answer" aria-label="Capture last answer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent-text)" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14a1 1 0 011 1v9a1 1 0 01-1 1H10l-4 3.5V16H5a1 1 0 01-1-1V6a1 1 0 011-1z"/></svg>
        <span class="dock-lbl">Capture answer</span>
      </button>
      <button id="dockAddBtn" class="dock-btn add-btn" data-action="dock-add" aria-label="Import or create">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <nav id="bottomNav" class="bottom-nav">
      <button data-nav="home" class="nav-item active" aria-current="page"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20h-5v-6H9v6H4z"/></svg></span><span class="nav-label">Home</span></button>
      <button data-nav="sets" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></span><span class="nav-label">Sets</span></button>
      <button data-nav="discover" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></span><span class="nav-label">Discover</span></button>
      <button data-nav="stats" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M5 20v-8M12 20V5M19 20v-5"/></svg></span><span class="nav-label">Stats</span></button>
      <button data-nav="you" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20.5c.8-4 4-6 8-6s7.2 2 8 6"/></svg></span><span class="nav-label">You</span></button>
    </nav>
    <div id="sheet" class="sheet hidden"></div>
    <div id="toast" class="toast hidden"></div>
    <script type="module" src="../../src/ui/panel.js?v=parity1"></script>
  </body>
</html>
